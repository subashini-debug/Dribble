<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dribbble Clone</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    .hero {
      background-color: #f9f8ff;
      padding: 100px 0;
      text-align: center;
    }
    .hero h1 {
      font-weight: 700;
      font-size: 3rem;
    }
    .hero p {
      color: #666;
      font-size: 1.1rem;
      margin-top: 10px;
    }
    .shot-img {
      width: 100%;
      border-radius: 15px;
      transition: transform 0.3s ease;
    }
    .shot-img:hover {
      transform: scale(1.05);
    }
    footer {
      background-color: #f1f1f1;
      padding: 20px 0;
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">dribbble<span class="text-danger">•clone</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item mx-2"><a class="nav-link" href="#">Inspiration</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#">Find Work</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#">Learn Design</a></li>
          <li class="nav-item mx-2"><a class="btn btn-dark btn-sm" href="#">Sign Up</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>Discover the world’s top designers</h1>
      <p>Dribbble is the leading destination to find and showcase creative work.</p>
      <a href="#" class="btn btn-danger mt-4 px-4 py-2">Get Started</a>
    </div>
  </section>

  <!-- Featured Shots -->
  <section class="py-5">
    <div class="container">
      <h2 class="fw-semibold mb-4 text-center">Popular Shots</h2>
      <div class="row g-4">
        <div class="col-md-4 col-sm-6">
          <img src="https://source.unsplash.com/random/400x300?design" class="shot-img" alt="Design Shot">
        </div>
        <div class="col-md-4 col-sm-6">
          <img src="https://source.unsplash.com/random/400x300?ui" class="shot-img" alt="Design Shot">
        </div>
        <div class="col-md-4 col-sm-6">
          <img src="https://source.unsplash.com/random/400x300?illustration" class="shot-img" alt="Design Shot">
        </div>
        <div class="col-md-4 col-sm-6">
          <img src="https://source.unsplash.com/random/400x300?art" class="shot-img" alt="Design Shot">
        </div>
        <div class="col-md-4 col-sm-6">
          <img src="https://source.unsplash.com/random/400x300?branding" class="shot-img" alt="Design Shot">
        </div>
        <div class="col-md-4 col-sm-6">
          <img src="https://source.unsplash.com/random/400x300?creative" class="shot-img" alt="Design Shot">
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p class="mb-0">&copy; 2025 Dribbble Clone. Built with ❤️ using Bootstrap.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
